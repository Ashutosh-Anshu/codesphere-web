<mat-sidenav-container class="h-full" style="background-color: var(--mat-sys-surface-container-low);">

  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile"
    class="!w-64 !rounded-none !border-0 flex flex-col" style="background-color: var(--mat-sys-surface-container);">

    <nav class="flex-1 overflow-y-auto scrollbar-hide p-3">

      <a routerLink="/crudOperations" routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3" aria-hidden="true">dashboard</mat-icon>
        <span class="font-medium">CRUD Operations</span>
      </a>

      <!-- <a routerLink="/identityAccess" routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3" aria-hidden="true">people</mat-icon>
        <span class="font-medium">Identity & Access </span>
      </a> -->

      <div class="mt-1">

        <button type="button" class="flex items-center w-full px-3 py-2.5 rounded-lg text-sm font-medium 
           hover:opacity-90" (click)="identityAccessExpanded = !identityAccessExpanded">

          <mat-icon class="mr-3" aria-hidden="true">admin_panel_settings</mat-icon>
          <span class="font-medium">Identity & Access</span>

          <mat-icon class="ml-auto transition-transform duration-200" [class.rotate-180]="identityAccessExpanded">
            expand_more
          </mat-icon>

        </button>

        @if (identityAccessExpanded) {

        <div class="ml-5 mt-1 pl-3 border-l flex flex-col gap-0.5 pb-2"
          style="border-color: var(--mat-sys-outline-variant);">

          <a routerLink="/users" routerLinkActive="active-link" class="nav-link"
            (click)="closeOnMobile()">
            <mat-icon class="mr-3" aria-hidden="true">people</mat-icon>
            <span class="font-medium">Users</span>
          </a>

          <a routerLink="/roles" routerLinkActive="active-link" class="nav-link"
            (click)="closeOnMobile()">
            <mat-icon class="mr-3" aria-hidden="true">shield</mat-icon>
            <span class="font-medium">Role</span>
          </a>

          <a routerLink="/login" routerLinkActive="active-link" class="nav-link"
            (click)="closeOnMobile()">
            <mat-icon class="mr-3" aria-hidden="true">login</mat-icon>
            <span class="font-medium">Login</span>
          </a>


        </div>

        }

      </div>


      <a routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3" aria-hidden="true">security</mat-icon>
        <span class="font-medium">Google OAuth Login</span>
      </a>

      <a routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3" aria-hidden="true">payment</mat-icon>
        <span class="font-medium">Payment Gateway</span>
      </a>

      <a routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3" aria-hidden="true">email</mat-icon>
        <span class="font-medium">Email Service</span>
        <!-- <span class="ml-auto rounded-full px-2 py-0.5 text-xs"
          style="background-color: var(--mat-sys-error); color: var(--mat-sys-on-error);">
          3
        </span> -->
      </a>

      <a routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3" aria-hidden="true">upload</mat-icon>
        <span class="font-medium">File Upload</span>
      </a>

      <a routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3" aria-hidden="true">scheduler</mat-icon>
        <span class="font-medium">Task Scheduler</span>
      </a>

      <a routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3" aria-hidden="true">help_outline</mat-icon>
        <span class="font-medium">Help & Support</span>
      </a>

    </nav>

    <!-- USER -->
    <!-- <div class="shrink-0 p-3" style="border-top: 1px solid var(--mat-sys-outline-variant);">
      <div class="flex items-center rounded-lg p-3" style="background-color: var(--mat-sys-surface-container);">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-sm font-semibold"
          style="background-color: var(--mat-sys-primary-container); color: var(--mat-sys-on-primary-container);">
          JD
        </div>
        <div class="ml-3 min-w-0">
          <p class="truncate text-sm font-medium" style="color: var(--mat-sys-on-surface);">John Doe</p>
          <p class="truncate text-xs" style="color: var(--mat-sys-on-surface-variant);">Administrator</p>
        </div>
      </div>
    </div> -->

  </mat-sidenav>

  <mat-sidenav-content class="min-w-0 overflow-auto p-4 sm:p-6"
    style="background-color: var(--mat-sys-surface-container-low); color: var(--mat-sys-on-surface);">
    <ng-content></ng-content>
  </mat-sidenav-content>

</mat-sidenav-container>
