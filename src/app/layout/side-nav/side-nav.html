<mat-sidenav-container class="h-[calc(100vh-4rem)]">

    <!-- Sidebar -->
    <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile"
        class="!w-64 border-gray-200 !bg-white dark:!bg-gray-900 dark:border-gray-700 !rounded-none">

        <!-- Navigation -->
        <nav class="p-3">

            <!-- Dashboard -->
            <a routerLink="/dashboard"
                routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400"
                class="mb-1 flex h-11 items-center rounded-lg px-3 text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                (click)="closeOnMobile()">
                <mat-icon class="mr-3">dashboard</mat-icon>
                <span>Dashboard</span>
            </a>

            <!-- Users -->
            <a routerLink="/users"
                routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400"
                class="mb-1 flex h-11 items-center rounded-lg px-3 text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                (click)="closeOnMobile()">
                <mat-icon class="mr-3">people</mat-icon>
                <span>Users</span>
            </a>

            <!-- Projects -->
            <a routerLink="/projects"
                routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400"
                class="mb-1 flex h-11 items-center rounded-lg px-3 text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                (click)="closeOnMobile()">
                <mat-icon class="mr-3">folder</mat-icon>
                <span>Projects</span>
            </a>

            <!-- Tasks -->
            <a routerLink="/tasks"
                routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400"
                class="mb-1 flex h-11 items-center rounded-lg px-3 text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                (click)="closeOnMobile()">
                <mat-icon class="mr-3">task_alt</mat-icon>
                <span>Tasks</span>
            </a>

            <!-- Messages -->
            <a routerLink="/messages"
                routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400"
                class="mb-1 flex h-11 items-center rounded-lg px-3 text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                (click)="closeOnMobile()">
                <mat-icon class="mr-3">message</mat-icon>
                <span>Messages</span>

                <span class="ml-auto rounded-full bg-red-500 px-2 py-0.5 text-xs text-white">
                    3
                </span>
            </a>

            <!-- Reports -->
            <a routerLink="/reports"
                routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400"
                class="mb-1 flex h-11 items-center rounded-lg px-3 text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                (click)="closeOnMobile()">
                <mat-icon class="mr-3">bar_chart</mat-icon>
                <span>Reports</span>
            </a>

            <!-- Settings -->
            <a routerLink="/settings"
                routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400"
                class="mb-1 flex h-11 items-center rounded-lg px-3 text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                (click)="closeOnMobile()">
                <mat-icon class="mr-3">settings</mat-icon>
                <span>Settings</span>
            </a>

            <!-- Help -->
            <a routerLink="/help"
                routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400"
                class="mb-1 flex h-11 items-center rounded-lg px-3 text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                (click)="closeOnMobile()">
                <mat-icon class="mr-3">help_outline</mat-icon>
                <span>Help & Support</span>
            </a>

        </nav>

        <!-- Bottom User Card -->
        <div class="absolute bottom-0 left-0 right-0 border-t border-gray-200 p-3 dark:border-gray-700">
            <div class="flex items-center rounded-lg bg-gray-50 p-3 dark:bg-gray-800">

                <div
                    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-indigo-100 text-sm font-semibold text-indigo-700">
                    JD
                </div>

                <div class="ml-3 min-w-0">
                    <p class="truncate text-sm font-medium text-gray-800 dark:text-white">
                        John Doe
                    </p>

                    <p class="truncate text-xs text-gray-500 dark:text-gray-400">
                        Administrator
                    </p>
                </div>

            </div>
        </div>

    </mat-sidenav>


    <!-- Main Content -->
    <mat-sidenav-content class="bg-gray-50 dark:bg-gray-950">

        <ng-content></ng-content>

    </mat-sidenav-content>

</mat-sidenav-container>
