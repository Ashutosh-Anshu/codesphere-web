<mat-sidenav-container class="h-full" style="background-color: var(--mat-sys-surface-container-low);">

  <mat-sidenav
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    class="!w-64 !rounded-none !border-0 flex flex-col"
    style="background-color: var(--mat-sys-surface-container-low);"
  >

    <nav class="flex-1 overflow-y-auto scrollbar-hide p-3">

      <a routerLink="/dashboard" routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3">dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a routerLink="/users" routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3">people</mat-icon>
        <span>Users</span>
      </a>

      <a routerLink="/projects" routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3">folder</mat-icon>
        <span>Projects</span>
      </a>

      <a routerLink="/tasks" routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3">task_alt</mat-icon>
        <span>Tasks</span>
      </a>

      <a routerLink="/messages" routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3">message</mat-icon>
        <span>Messages</span>
        <span
          class="ml-auto rounded-full px-2 py-0.5 text-xs"
          style="background-color: var(--mat-sys-error); color: var(--mat-sys-on-error);"
        >
          3
        </span>
      </a>

      <a routerLink="/reports" routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3">bar_chart</mat-icon>
        <span>Reports</span>
      </a>

      <a routerLink="/settings" routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3">settings</mat-icon>
        <span>Settings</span>
      </a>

      <a routerLink="/help" routerLinkActive="active-link" class="nav-link" (click)="closeOnMobile()">
        <mat-icon class="mr-3">help_outline</mat-icon>
        <span>Help & Support</span>
      </a>

    </nav>

    <!-- USER -->
    <div class="shrink-0 p-3" style="border-top: 1px solid var(--mat-sys-outline-variant);">
      <div class="flex items-center rounded-lg p-3" style="background-color: var(--mat-sys-surface-container);">
        <div
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-sm font-semibold"
          style="background-color: var(--mat-sys-primary-container); color: var(--mat-sys-on-primary-container);"
        >
          JD
        </div>
        <div class="ml-3 min-w-0">
          <p class="truncate text-sm font-medium" style="color: var(--mat-sys-on-surface);">John Doe</p>
          <p class="truncate text-xs" style="color: var(--mat-sys-on-surface-variant);">Administrator</p>
        </div>
      </div>
    </div>

  </mat-sidenav>

  <mat-sidenav-content
    class="min-w-0 overflow-auto p-4 sm:p-6"
    style="background-color: var(--mat-sys-surface-container-low); color: var(--mat-sys-on-surface);"
  >
    <ng-content></ng-content>
  </mat-sidenav-content>

</mat-sidenav-container>
