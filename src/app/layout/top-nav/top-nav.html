<mat-toolbar
  class="!h-16 !px-3 sm:!px-4 md:!px-6"
  style="background-color: var(--mat-sys-surface); color: var(--mat-sys-on-surface); border-bottom: 1px solid var(--mat-sys-outline-variant);"
>

  <button mat-icon-button aria-label="Toggle sidebar" (click)="toggleSidebar.emit()" class="mr-2">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="flex items-center">
    <span class="text-lg font-semibold sm:text-xl">Code Sphere</span>
  </div>

  <span class="flex-1"></span>

  <button mat-icon-button aria-label="Toggle theme" (click)="toggleTheme.emit()" class="mr-1">
    <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="notificationMenu" aria-label="Notifications" class="mr-1">
    <mat-icon [matBadge]="3" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
  </button>

  <mat-menu #notificationMenu="matMenu">
    <div class="w-72 px-4 py-3 sm:w-80">
      <h3 class="font-semibold" style="color: var(--mat-sys-on-surface);">Notifications</h3>
      <p class="text-sm" style="color: var(--mat-sys-on-surface-variant);">You have 3 new notifications</p>
    </div>

    <mat-divider></mat-divider>

    <button mat-menu-item>
      <mat-icon>info</mat-icon>
      <span>New update available</span>
    </button>

    <button mat-menu-item>
      <mat-icon>message</mat-icon>
      <span>New message received</span>
    </button>

    <button mat-menu-item>
      <mat-icon>task_alt</mat-icon>
      <span>Task completed</span>
    </button>

    <mat-divider></mat-divider>

    <button mat-menu-item>
      <span style="color: var(--mat-sys-primary);">View all notifications</span>
    </button>
  </mat-menu>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
    <div
      class="flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold"
      style="background-color: var(--mat-sys-primary-container); color: var(--mat-sys-on-primary-container);"
    >
      JD
    </div>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="w-56 px-4 py-3">
      <p class="font-semibold" style="color: var(--mat-sys-on-surface);">John Doe</p>
      <p class="text-sm" style="color: var(--mat-sys-on-surface-variant);">john@example.com</p>
    </div>

    <mat-divider></mat-divider>

    <button mat-menu-item>
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>

    <button mat-menu-item>
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </button>

    <mat-divider></mat-divider>

    <button mat-menu-item>
      <mat-icon style="color: var(--mat-sys-error);">logout</mat-icon>
      <span style="color: var(--mat-sys-error);">Logout</span>
    </button>
  </mat-menu>

</mat-toolbar>
