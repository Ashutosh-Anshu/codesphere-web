<div class="dense-fields w-full max-w-[calc(100vw-2rem)] sm:max-w-lg md:max-w-xl overflow-hidden">

    <div class="flex items-center gap-2 border-b px-4 py-3 sm:px-5 sm:py-4">


        <mat-icon>info</mat-icon>

        <div class="min-w-0">
            <h2 class="truncate text-base font-semibold sm:text-lg">
                Confirmation
            </h2>
        </div>
    </div>

    <div class="border-b px-4 py-4 text-sm sm:px-5">
        {{ message }}
    </div>

    <div class="flex items-stretch justify-end gap-2 px-4 py-4 sm:px-5">

        <button mat-stroked-button color="primary" class="!h-9 !rounded-sm !px-5" type="button" (click)="cancel()">
            Cancel
        </button>

        <button mat-flat-button color="warn" class="!h-9 !rounded-sm !px-5" type="button" (click)="confirm()">
            Delete
        </button>

    </div>

</div>
